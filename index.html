<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reos Auth Callback</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1c1c1e;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #2c2c2e;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            max-width: 320px;
        }
        .spinner {
            border: 3px solid #3a3a3c;
            border-top: 3px solid #0a84ff;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="card">
        <h3 id="status-title">Authenticating...</h3>
        <p id="status-msg">Verifying your credentials with Reos Auth.</p>
        <div class="spinner" id="loader"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const status = urlParams.get('status') || 'ALLOWED';

        if (code && window.opener) {
            window.opener.postMessage({
                type: 'REOS_AUTH_GITHUB_CALLBACK',
                code: code,
                status: status
            }, '*');

            document.getElementById('status-title').innerText = 'Success!';
            document.getElementById('status-msg').innerText = 'Returning to PenguinMod...';
            document.getElementById('loader').style.display = 'none';

            setTimeout(() => window.close(), 800);
        } else {
            document.getElementById('status-title').innerText = 'Authentication Complete';
            document.getElementById('status-msg').innerText = 'You can now close this tab and return to PenguinMod.';
            document.getElementById('loader').style.display = 'none';
        }
    </script>
</body>
</html>
