<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reos Auth Callback</title>
    <script src="https://reostech.pagekite.me/reos-guard.js" defer></script>
</head>
<body>
    <script>
        (function() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code') || '';
            const status = urlParams.get('status') || (code ? 'ALLOWED' : 'FAILED');

            if (window.opener) {
                window.opener.postMessage({
                    type: 'REOS_AUTH_GITHUB_CALLBACK',
                    code: code,
                    status: status
                }, '*');

                setTimeout(function() {
                    window.close();
                }, 300);
            }
        })();
    </script>
</body>
</html>
